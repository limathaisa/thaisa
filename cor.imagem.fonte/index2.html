<body>
    <h1>escolha a imagem e a cor da sua pagina</h1>
    <p>escolha a cor</p>
    <select name="cordapag" id="select">
    <option value="azul">azul</option>
    <option value="vermelho">vermelho</option>
    <option value="roxo">roxo</option>
    <option value="laranja">laranja</option>
    <option value="verde">verde</option>
    <option value="marrom">marrom</option> 
    </select>  

     <p>escolha a imagem e a fonte</p>
     <form action=""  method="get" id="form">
        <input type="url" id="url" placeholder="Digite a url da imagem">
        <input type="text" id="font" placeholder="Digite a fonte que deseja usar">
        <button type="submit" id="btn">Escolher</button>
     </form>
     <div id="div">
        <img id="img"></img>
     </div>
</body>
